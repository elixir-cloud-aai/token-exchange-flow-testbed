site_name: Token exchange testbed
site_description: >-
  Trying per-hop token exchange with LS Login, on a local machine
# Read the Docs serves each version under its own path. No URL is assumed here:
# the variable is set in its builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]
repo_url: https://github.com/elixir-cloud-aai/token-exchange-flow-testbed
repo_name: elixir-cloud-aai/token-exchange-flow-testbed
edit_uri: edit/dev/docs/

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
- Home: index.md
- Background:
  - Use case: background/use-case.md
  - Requirements: background/requirements.md
  - Design: background/design.md
- Testbed:
  - testbed/index.md
  - Assumptions and constraints: testbed/assumptions.md
  - Actors and components: testbed/components.md
  - Testbed design: testbed/design.md
  - Testbed limits: testbed/limits.md
  - Coverage: testbed/coverage.md
- Setup:
  - Requirements: setup/requirements.md
  - Installation: setup/installation.md
  - Configuration: setup/configuration.md
  - Client registration: setup/client-registration.md
  - Checking the setup: setup/checking.md
  - Troubleshooting: setup/troubleshooting.md
  - Optional, remote machines: setup/remote.md
- Tests:
  - tests/index.md
  - T1 Delegated call chain: tests/t1-call-chain.md
  - T2 Refused requests: tests/t2-refused.md
  - T3 Groups and entitlements: tests/t3-groups.md
  - T4 Token lifetime and refresh: tests/t4-lifetime.md
  - T5 Attribution across hops: tests/t5-attribution.md
- About:
  - Contact: about/contact.md
  - Contributors: about/contributors.md
  - Citation: about/citation.md
  - License: about/license.md
  - Acknowledgements: about/acknowledgements.md
  - Contributing and development: about/development.md
  - Glossary: about/glossary.md
  - Commands: about/commands.md
  - References: about/references.md
