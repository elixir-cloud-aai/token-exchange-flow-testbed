[project]
name = "token-exchange-testbed"
version = "0.1.0"
description = "Local testbed for trying token exchange with LS Login, per hop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The Python version of the image (`Dockerfile`), the only one targeted
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.0",
    "pyjwt[crypto]>=2.10",
    "requests>=2.32",
]

[project.scripts]
testbed-services = "testbed.launcher:main"
testbed-session = "testbed.session:main"
testbed-e2e = "testbed.e2e:main"

[project.optional-dependencies]
dev = [
    "ast-grep-cli>=0.30",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-requests>=2.32",
]
# Documentation (`mkdocs.yml`), built by Read the Docs (`.readthedocs.yaml`)
# and in CI
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
    "pymdown-extensions>=10,<13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=testbed --cov-report=term-missing -p no:cacheprovider"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
# Only the entry points of scripts: the same `main()` is tested directly
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "UP", "S", "ANN", "RUF"]
ignore = ["ANN401", "D203", "D213", "S101", "S105", "S106", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "tests"]
